# Include inside the existing canonical xiaohondou.com TLS server on DMIT.
# This directory contains only public original installers and their manifest.
location = /downloads/clients/manifest.json {
    root /srv/sub2api-public;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
location ~ ^/downloads/clients/releases/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+\.(dmg|msi|msix)$ {
    root /srv/sub2api-public;
    default_type application/octet-stream;
    add_header Content-Disposition attachment always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    sendfile on;
    try_files $uri =404;
}
location /downloads/clients/ {
    return 404;
}
