# Include inside the existing canonical xiaohondou.com TLS server on DMIT.
# Only the small catalog is public. Installer bytes require a one-use ticket.
location = /downloads/clients/manifest.json {
    root /srv/sub2api-public;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
location = /downloads/clients/fetch {
    add_header Cache-Control "private, no-store" always;
    return 307 https://downloads.xiaohondou.com/downloads/clients/fetch;
}
location ^~ /downloads/clients/releases/ {
    add_header Cache-Control "private, no-store" always;
    return 403;
}
location /downloads/clients/ {
    return 404;
}
