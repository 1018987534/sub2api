# TLS server downloads.xiaohondou.com; HTTP context zones must be installed first.
location = /downloads/clients/fetch {
    limit_req zone=client_download_requests burst=3 nodelay;
    limit_req zone=client_download_requests_global burst=10 nodelay;
    limit_req_status 429;
    limit_conn client_download_ip 2;
    limit_conn client_download_global 4;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:8080/api/v1/client-downloads/transfer;
    proxy_set_header Host downloads.xiaohondou.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Authorization "";
    proxy_read_timeout 15s;
    proxy_buffering off;
    add_header Cache-Control "private, no-store" always;
}
location ^~ /_protected/client-downloads/ {
    internal;
    alias /srv/sub2api-downloads/clients/;
    disable_symlinks on;
    autoindex off;
    types { }
    default_type application/octet-stream;
    max_ranges 1;
    limit_rate 2m;
    limit_conn client_download_ip 2;
    limit_conn client_download_global 4;
    limit_conn_status 429;
    sendfile on;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location /downloads/clients/ {
    add_header Cache-Control "private, no-store" always;
    return 403;
}
