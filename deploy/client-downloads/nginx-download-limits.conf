# HTTP context, /etc/nginx/conf.d/sub2api-download-limits.conf.
limit_req_zone $binary_remote_addr zone=client_download_requests:1m rate=1r/s;
limit_req_zone $server_name zone=client_download_requests_global:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=client_download_ip:1m;
limit_conn_zone $server_name zone=client_download_global:1m;
