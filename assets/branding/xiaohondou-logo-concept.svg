<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">小红豆</title>
  <desc id="desc">A compact red bean sprouting two leaves, designed for the Xiaohondou brand.</desc>
  <defs>
    <linearGradient id="tile" x1="76" y1="54" x2="432" y2="468" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F6F1E9"/>
    </linearGradient>
    <linearGradient id="bean" x1="129" y1="116" x2="389" y2="408" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F04B59"/>
      <stop offset=".55" stop-color="#D52F43"/>
      <stop offset="1" stop-color="#B61E34"/>
    </linearGradient>
    <linearGradient id="leaf" x1="261" y1="68" x2="390" y2="135" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55AD75"/>
      <stop offset="1" stop-color="#25704C"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#781322" flood-opacity=".18"/>
    </filter>
    <mask id="bean-shape">
      <rect width="512" height="512" fill="#000"/>
      <path fill="#fff" d="M339 100c70 8 117 67 108 137-10 76-69 154-143 185-79 33-173 5-216-64-43-70-25-162 42-214 54-42 132-62 209-44Z"/>
      <ellipse cx="260" cy="176" rx="82" ry="53" fill="#000" transform="rotate(-36 260 176)"/>
    </mask>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#tile)"/>
  <rect x="21" y="21" width="470" height="470" rx="115" fill="none" stroke="#332C2C" stroke-opacity=".09" stroke-width="2"/>

  <g filter="url(#shadow)">
    <g mask="url(#bean-shape)">
      <rect x="65" y="82" width="390" height="360" fill="url(#bean)"/>
      <path d="M101 267c39-43 89-58 146-47 58 12 87 57 142 38 23-8 42-25 57-49-3 70-57 151-135 186-81 36-176 10-213-59-12-23-15-46-12-69 5 7 10 7 15 0Z" fill="#8F1429" opacity=".16"/>
      <path d="M131 199c30-39 75-66 123-76-30 19-52 43-62 73-10 31-36 52-72 62-2-20 1-40 11-59Z" fill="#FF9A9F" opacity=".34"/>
    </g>

    <path d="M282 115c8-42 42-69 88-64-6 43-37 72-88 64Z" fill="url(#leaf)"/>
    <path d="M277 116c-30-27-36-62-15-96 35 23 45 58 15 96Z" fill="#3C8D5E"/>
    <path d="M275 124c19-19 43-37 70-52" fill="none" stroke="#F7F1E6" stroke-opacity=".65" stroke-linecap="round" stroke-width="8"/>
  </g>

  <path d="M156 301c17 43 57 65 101 61" fill="none" stroke="#FFF8EE" stroke-linecap="round" stroke-width="18" opacity=".88"/>
  <circle cx="157" cy="300" r="9" fill="#FFF8EE"/>
  <circle cx="258" cy="362" r="9" fill="#FFF8EE"/>
</svg>
