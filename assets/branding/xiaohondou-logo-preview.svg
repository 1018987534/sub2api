<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">小红豆 Logo 方案预览</title>
  <desc id="desc">The Xiaohondou logo shown at app-icon and sidebar sizes on light and dark surfaces.</desc>
  <defs>
    <linearGradient id="preview-bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F5F1"/>
      <stop offset="1" stop-color="#ECE9E3"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#342A2A" flood-opacity=".09"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#preview-bg)"/>
  <text x="72" y="92" fill="#252122" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="36" font-weight="700">小红豆</text>
  <text x="72" y="132" fill="#6E6666" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18">Logo concept 01</text>

  <rect x="72" y="176" width="650" height="500" rx="8" fill="#FFFFFF" filter="url(#card-shadow)"/>
  <image href="xiaohondou-logo-concept.svg" x="192" y="224" width="410" height="410"/>

  <rect x="762" y="176" width="366" height="230" rx="8" fill="#16191F" filter="url(#card-shadow)"/>
  <rect x="798" y="222" width="294" height="56" rx="8" fill="#20242C"/>
  <image href="xiaohondou-logo-concept.svg" x="808" y="232" width="36" height="36"/>
  <text x="860" y="258" fill="#F5F3EE" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="650">小红豆</text>
  <circle cx="1022" cy="250" r="4" fill="#D52F43"/>
  <circle cx="1044" cy="250" r="4" fill="#4D5562"/>
  <circle cx="1066" cy="250" r="4" fill="#4D5562"/>

  <rect x="762" y="446" width="366" height="230" rx="8" fill="#FFFFFF" filter="url(#card-shadow)"/>
  <rect x="798" y="492" width="294" height="56" rx="8" fill="#F7F6F3" stroke="#E5E1DA"/>
  <image href="xiaohondou-logo-concept.svg" x="808" y="502" width="36" height="36"/>
  <text x="860" y="528" fill="#252122" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="650">小红豆</text>
  <circle cx="1022" cy="520" r="4" fill="#D52F43"/>
  <circle cx="1044" cy="520" r="4" fill="#D5D0C8"/>
  <circle cx="1066" cy="520" r="4" fill="#D5D0C8"/>
</svg>
